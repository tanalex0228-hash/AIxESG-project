{% extends "base.html" %}
{% block title %}新增資料{% endblock %}
{% block content %}
<div class="page-hero compact">
  <div>
    <div class="eyebrow">Admin Form</div>
    <h1 class="page-title small">新增 {{ item_type }}</h1>
    <p class="page-subtitle">儲存後會納入平台治理與分析規則資料。</p>
  </div>
</div>
<section class="panel narrow">
  <div class="panel-header">
    <div>
      <h2 class="panel-title">資料內容</h2>
      <p class="panel-kicker">請確認欄位與命名一致</p>
    </div>
  </div>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">儲存</button>
  </form>
</section>
{% endblock %}
