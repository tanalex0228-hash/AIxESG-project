{% extends "base.html" %}
{% block title %}登入 | AI ESG 智慧診斷{% endblock %}
{% block content %}
<div class="auth-layout">
  <section class="auth-copy">
    <div>
      <div class="eyebrow">AIxESG Secure Access</div>
      <h1>登入你的 ESG 評級工作區。</h1>
      <p>延續企業報告、GRI 評分、標竿比較與改善建議的分析流程。</p>
    </div>
  </section>
  <section class="auth-shell">
      <div class="panel-header">
        <div>
          <h2 class="panel-title">登入</h2>
          <p class="panel-kicker">使用已註冊帳號進入平台</p>
        </div>
      </div>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100" type="submit">登入</button>
      </form>
      <div class="mt-3 small text-secondary">還沒有帳號？<a href="{% url 'accounts:register' %}">註冊新帳號</a></div>
  </section>
</div>
{% endblock %}
