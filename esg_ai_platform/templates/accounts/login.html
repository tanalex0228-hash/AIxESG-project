{% extends "base.html" %}
{% block title %}登入 | AI ESG 智慧診斷{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <section class="panel">
      <h1 class="h4 mb-3">登入</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100" type="submit">登入</button>
      </form>
      <div class="mt-3 small text-secondary">還沒有帳號？<a href="{% url 'accounts:register' %}">註冊新帳號</a></div>
    </section>
  </div>
</div>
{% endblock %}
